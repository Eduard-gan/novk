logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: {{ get_env(name="PORT", default="8000") }}
  binding: {{ get_env(name="BINDING", default="127.0.0.1") }}
  host: http://{{ get_env(name="DOMAIN", default="localhost") }}
  middlewares:
    fallback:
      enable: false
    cors:
      enable: true
      allow_origins:
        - http://{{ get_env(name="DOMAIN", default="localhost") }}:{{ get_env(name="PORT", default="8000") }}
      allow_methods:
        - GET
        - POST
        - OPTIONS
      allow_headers:
        - content-type
      allow_credentials: true
    static:
      enable: true
      must_exist: true
      precompressed: false
      folder:
        uri: "/static"
        path: "assets/static"
      fallback: "assets/static/404.html"

workers:
  mode: BackgroundAsync

database:
  uri: {{ get_env(name="DATABASE_URL", default="sqlite://novk.sqlite?mode=rwc") }}
  enable_logging: false
  connect_timeout: {{ get_env(name="DB_CONNECT_TIMEOUT", default="500") }}
  idle_timeout: {{ get_env(name="DB_IDLE_TIMEOUT", default="500") }}
  min_connections: {{ get_env(name="DB_MIN_CONNECTIONS", default="1") }}
  max_connections: {{ get_env(name="DB_MAX_CONNECTIONS", default="1") }}
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

auth:
  jwt:
    secret: {{ get_env(name="JWT_SECRET", default="H4DBGycagIRKfUySCYps") }}
    expiration: 604800

    location:
      from: Cookie
      name: auth

settings:
  uploaded_dir: {{ get_env(name="UPLOADED_DIR", default="assets/static/uploaded") | json_encode() }}
  upload_file_limit: 20971520
