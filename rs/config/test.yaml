logger:
  enable: false
  pretty_backtrace: false
  level: info
  format: compact

server:
  port: 8000
  binding: 127.0.0.1
  host: http://localhost
  middlewares:
    fallback:
      enable: false

workers:
  mode: ForegroundBlocking

database:
  uri: sqlite://novk_test.sqlite?mode=rwc
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 1
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

auth:
  jwt:
    secret: dGVzdC1vbmx5LXNlY3JldC1ub3QtZm9yLXByb2R1Y3Rpb24=
    expiration: 604800

    location:
      from: Cookie
      name: auth

settings:
  uploaded_dir: {{ get_env(name="NOVK_TEST_UPLOADED_DIR") | json_encode() }}
  upload_file_limit: 20971520
