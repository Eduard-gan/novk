services:
  novk:
    build:
      context: .
      dockerfile: Dockerfile
    image: novk:latest
    container_name: novk
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOCO_ENV: production
      BINDING: 172.18.0.1
      PORT: 8000
      DATABASE_URL: sqlite:///mnt/novk-data/data/novk/novk.sqlite?mode=rwc
      TZ: CET
      UPLOADED_DIR: /mnt/novk-data/data/novk/static/uploaded
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /mnt/novk-data:/mnt/novk-data
